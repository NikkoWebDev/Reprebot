# Blueprint de Render para la API de Reprebot (fork CEIS).
#
# MEDIDO: con embeddings locales (fastembed + onnxruntime) el proceso sube a
# ~1100 MB en la primera consulta, y a ~717 MB incluso con el modelo mas chico
# que soporta fastembed. El plan free (512 MB) haria OOM en la primera pregunta.
#
# Por eso los embeddings van por API remota (Jina AI, plan free: 100 RPM /
# 100K TPM). Asi fastembed no se carga y el proceso queda en ~150 MB, que cabe
# en free. Requiere EMBEDDINGS_API_KEY y reindexar con ese modelo.
services:
  - type: web
    name: reprebot-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      # embeddings por API remota: sin esto el free hace OOM (ver arriba)
      - key: EMBEDDINGS_API_URL
        value: https://api.jina.ai/v1/embeddings
      - key: EMBEDDINGS_API_KEY
        sync: false
      - key: EMBEDDINGS_MODEL
        value: jina-embeddings-v3
      - key: EMBEDDINGS_DIM
        value: "1024"
      # 5173 = vite dev, 4173 = vite preview
      - key: CORS_ORIGINS
        value: https://ceis-unal.com,https://www.ceis-unal.com,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173
      - key: ADMIN_TOKEN
        sync: false
      - key: SUPABASE_URL
        value: https://mamirtgawcxjblmwaock.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # perfil 'Reprebot' ya creado en Supabase (b6af4105-...)
      - key: FORUM_BOT_USER_ID
        value: b6af4105-c044-4ee9-85ff-aee253fca85c
      # vacia a proposito: asi /api/forum/answer no exige header X-Api-Key y el
      # boton "Pedir respuesta a Reprebot" del foro funciona desde el navegador.
      # Si le pone valor, hay que usar un Database Webhook y quitar el boton.
      - key: FORUM_API_KEY
        value: ""
      # 'Otro' incluido: es el tag por defecto y sin el el bot omite casi todo
      - key: FORUM_TAG_ALLOWLIST
        value: "Duda académica,Inscripciones y trámites,Bienestar,Otro"
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      # puente de WhatsApp (apps/whatsapp). Vacio = el endpoint no pide header.
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_MAX_CHARS
        value: "1800"

  # Puente de WhatsApp (Baileys). Va en un servicio aparte porque necesita un
  # proceso Node siempre encendido con la sesion del numero; el backend no puede
  # mantener ese WebSocket.
  #
  # OJO con el plan free: si WA_KEEPALIVE=true el servicio nunca se duerme (sin
  # el keep-alive, Render lo duerme a los 15 min y deja de recibir mensajes), y
  # los free tienen 750 horas-instancia al mes por workspace. Un mes son ~730 h,
  # asi que el puente se come casi toda la cuota; si el backend tambien corre,
  # Render puede suspender los free al final del mes. El disco tambien es
  # efimero: cada deploy o reinicio pide QR otra vez.
  - type: web
    name: reprebot-whatsapp
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./apps/whatsapp/Dockerfile
    dockerContext: ./apps/whatsapp
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # los free no pueden recibir trafico de red privada: URL publica
      - key: BACKEND_URL
        value: https://reprebot-api.onrender.com
      - key: WHATSAPP_API_KEY
        sync: false
      # un solo grupo: por nombre (case-insensitive) o por JID ...@g.us
      - key: WA_GROUP_NAME
        value: ceis
      - key: WA_GROUP_JID
        sync: false
      - key: WA_TRIGGERS
        value: "!repre,/repre"
      - key: WA_COOLDOWN_SECONDS
        value: "20"
      - key: WA_MAX_PER_MINUTE
        value: "6"
      - key: WA_MAX_CHARS
        value: "1800"
      - key: WA_KEEPALIVE
        value: "true"
      # sin esto /qr devuelve 403: el QR empareja la sesion, no puede ser publico
      - key: WA_QR_TOKEN
        sync: false
