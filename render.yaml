# Blueprint de Render para la API de Reprebot (fork CEIS).
#
# MEDIDO: con embeddings locales (fastembed + onnxruntime) el proceso sube a
# ~1100 MB en la primera consulta, y a ~717 MB incluso con el modelo mas chico
# que soporta fastembed. El plan free (512 MB) haria OOM en la primera pregunta.
#
# Por eso los embeddings van por API remota (Jina AI, plan free: 100 RPM /
# 100K TPM). Asi fastembed no se carga y el proceso queda en ~150 MB, que cabe
# en free. Requiere EMBEDDINGS_API_KEY y reindexar con ese modelo.
services:
  - type: web
    name: reprebot-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      # embeddings por API remota: sin esto el free hace OOM (ver arriba)
      - key: EMBEDDINGS_API_URL
        value: https://api.jina.ai/v1/embeddings
      - key: EMBEDDINGS_API_KEY
        sync: false
      - key: EMBEDDINGS_MODEL
        value: jina-embeddings-v3
      - key: EMBEDDINGS_DIM
        value: "1024"
      - key: CORS_ORIGINS
        value: https://ceis-unal.com,https://www.ceis-unal.com,http://localhost:5173
      - key: ADMIN_TOKEN
        sync: false
      - key: SUPABASE_URL
        value: https://mamirtgawcxjblmwaock.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # perfil 'Reprebot' ya creado en Supabase (b6af4105-...)
      - key: FORUM_BOT_USER_ID
        value: b6af4105-c044-4ee9-85ff-aee253fca85c
      - key: FORUM_API_KEY
        sync: false
      # 'Otro' incluido: es el tag por defecto y sin el el bot omite casi todo
      - key: FORUM_TAG_ALLOWLIST
        value: "Duda académica,Inscripciones y trámites,Bienestar,Otro"
      - key: RATE_LIMIT_PER_MIN
        value: "20"
