# Blueprint de Render para la API de Reprebot (fork CEIS).
#
# OJO con el plan: fastembed + onnxruntime con un modelo BERT-base piden
# ~1 GB de RAM. El plan "starter" (512 MB) probablemente hace OOM.
# Alternativas: bajar a un modelo de embeddings mas pequeno o usar
# un VPS / Railway con 1 GB.
services:
  - type: web
    name: reprebot-api
    runtime: docker
    plan: standard
    region: ohio
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDINGS_MODEL
        value: jinaai/jina-embeddings-v2-base-es
      - key: CORS_ORIGINS
        value: https://ceis-unal.vercel.app,http://localhost:5173
      - key: ADMIN_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FORUM_BOT_USER_ID
        sync: false
      - key: FORUM_API_KEY
        sync: false
      - key: FORUM_TAG_ALLOWLIST
        value: "Duda académica,Inscripciones y trámites,Bienestar"
      - key: RATE_LIMIT_PER_MIN
        value: "20"
