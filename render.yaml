# Blueprint de Render para la API de Reprebot (fork CEIS).
#
# MEDIDO (no estimado): con el modelo jina-v2-base-es el proceso sube a
# ~1100 MB en la primera consulta (fastembed + onnxruntime preasignan en el
# primer embed). Con el modelo multilingue mas pequeno que soporta fastembed
# (paraphrase-multilingual-MiniLM-L12-v2, 384 dims) tambien sube a ~717 MB.
# El plan free (512 MB) hace OOM en la primera pregunta; limitar hilos
# (OMP_NUM_THREADS) no cambia nada.
#
# El plan que funciona tal cual es "standard" (2 GB). Para usar el free hay
# que sacar los embeddings del contenedor: moverlos a una API remota
# (Jina AI / OpenAI / Cohere) y reindexar. Con eso el proceso baja a ~150 MB.
services:
  - type: web
    name: reprebot-api
    runtime: docker
    # free = 512 MB: OOM en la primera consulta. Cambie a standard o mueva
    # los embeddings a una API remota antes de usar free.
    plan: free
    region: ohio
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDINGS_MODEL
        value: jinaai/jina-embeddings-v2-base-es
      - key: CORS_ORIGINS
        value: https://ceis-unal.com,https://www.ceis-unal.com,http://localhost:5173
      - key: ADMIN_TOKEN
        sync: false
      - key: SUPABASE_URL
        value: https://mamirtgawcxjblmwaock.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # perfil 'Reprebot' ya creado en Supabase (b6af4105-...)
      - key: FORUM_BOT_USER_ID
        value: b6af4105-c044-4ee9-85ff-aee253fca85c
      - key: FORUM_API_KEY
        sync: false
      # 'Otro' incluido: es el tag por defecto y sin el el bot omite casi todo
      - key: FORUM_TAG_ALLOWLIST
        value: "Duda académica,Inscripciones y trámites,Bienestar,Otro"
      - key: RATE_LIMIT_PER_MIN
        value: "20"
